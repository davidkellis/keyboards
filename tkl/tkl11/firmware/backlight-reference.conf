# Reference only: merge into the actual V11 board/shield configuration.
# This is not a complete, compiled or hardware-tested firmware build.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_LED_PWM=y
CONFIG_PINCTRL=y
CONFIG_ZMK_BACKLIGHT_BRT_START=25
CONFIG_ZMK_BACKLIGHT_BRT_STEP=10
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Stock START values can be overridden by settings previously saved in flash.
# Battery-specific caps and dimming/fading are additional behavior, not enabled
# by these lines. Do not turn off backlight simply because USB is disconnected.
