</text><text x="322" y="399" font-size="17">Match the full keyboard power density</text><text x="322" y="422" font-size="12">About 1/5 of ten-source LED output power.</text><text x="322" y="469" font-size="17">Keep the same stock and exposure</text><text x="322" y="492" font-size="12">Three etch densities; add a separate reflector.</text><text x="322" y="558" font-size="12">Guide size: 70.152 × 129.19 mm. Etch underside.</text><text x="322" y="581" font-size="12">Native LED-channel handedness must be checked.</text></g></svg>