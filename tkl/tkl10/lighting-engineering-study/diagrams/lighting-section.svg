<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="#f5f4ed"/><g font-family="sans-serif" fill="#243b37"><text x="28" y="38" font-size="25">V10 lighting: illuminate the legend through the switch LED channel</text><text x="28" y="65" font-size="14">Conceptual section; dimensions and optical efficiency need a bench sample.</text><text x="40" y="105" font-size="19">Recommended: one white LED per key</text><text x="40" y="129" font-size="13">A short light path; one shared PWM control</text><rect x="120" y="153" width="230" height="38" rx="12" fill="#c8cec2"/><text x="180" y="178" font-size="14">XVX keycap</text><rect x="152" y="198" width="166" height="56" rx="5" fill="#6383aa"/><text x="185" y="231" fill="white" font-size="14">Whale switch</text><rect x="70" y="270" width="340" height="17" fill="#466b54"/><text x="85" y="264" font-size="12">PCB</text><rect x="282" y="197" width="16" height="74" fill="#cedcda"/><rect x="278" y="267" width="24" height="23" fill="#faf7d4"/><path d="M290,267V190" stroke="#d3a546" stroke-width="5"/><path d="M282,200l8,-13l8,13" fill="none" stroke="#d3a546" stroke-width="3"/><rect x="275" y="287" width="30" height="16" rx="3" fill="#e8b14b"/><text x="170" y="331" font-size="13">Reverse-mount LED + its own resistor</text><text x="75" y="363" font-size="13">Local diffuser only if the sample benefits.</text><text x="75" y="386" font-size="13">Keep factory components on the bottom where feasible.</text><text x="535" y="105" font-size="19">Alternative: side-lit guide below PCB</text><text x="535" y="129" font-size="13">24 sources / 86 extraction windows</text><rect x="615" y="153" width="230" height="38" rx="12" fill="#c8cec2"/><text x="675" y="178" font-size="14">XVX keycap</text><rect x="647" y="198" width="166" height="56" rx="5" fill="#6383aa"/><text x="680" y="231" fill="white" font-size="14">Whale switch</text><rect x="565" y="270" width="340" height="17" fill="#466b54"/><text x="580" y="264" font-size="12">PCB</text><rect x="777" y="197" width="16" height="74" fill="#cedcda"/><rect x="773" y="267" width="24" height="23" fill="#faf7d4"/><path d="M785,267V190" stroke="#d3a546" stroke-width="5"/><path d="M777,200l8,-13l8,13" fill="none" stroke="#d3a546" stroke-width="3"/><rect x="555" y="304" width="360" height="17" fill="#b9dfe6"/><rect x="555" y="327" width="360" height="6" fill="#e5e7db"/><rect x="537" y="306" width="16" height="13" fill="#e8b14b"/><path d="M559,313H785V291" fill="none" stroke="#d3a546" stroke-width="4"/><text x="580" y="365" font-size="13">Guide + reflector + clearance around pins/components.</text><text x="580" y="388" font-size="13">Full case fit is unresolved; prototype before routing.</text></g></svg>