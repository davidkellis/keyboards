<text x="115" y="174" class="body">Finished body: 264 × 50 × 5.5 mm</text>
<text x="115" y="204" class="small">Reserve: 270 × 52 × 6.3 mm + 0.5 mm padding below</text>
<text x="690" y="185" class="small">Rear electronics</text>
